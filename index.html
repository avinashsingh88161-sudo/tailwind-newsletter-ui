<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tailwind</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <div class="mt-20 mx-52 flex flex-wrap rounded-lg border-2 border-black">
      <div
        class="w-full h-24 bg-linear-to-t from-sky-500 to-indigo-500 text-white flex justify-center items-center font-bold text-xl rounded-t-lg"
      >
        News You Can Trust.
      </div>

      <div class="text-center mt-6 w-full">
        <h3 class="text-lg font-semibold">Stay up to date with the latest</h3>

        <p>
          Subscribe to our newsletter to get the latest news straight to your
          inbox.
        </p>

        <form action="" class="flex flex-wrap w-full px-10">
          <input
            type="text"
            placeholder="you@email.com"
            class="rounded-full bg-slate-200 text-center placeholder:text-sm my-4 py-2 w-full"
          />

          <button class="bg-blue-500 w-full text-white py-2 rounded-full">
            Subscribe Now
          </button>
        </form>

        <p class="my-6 text-sm">We value your privacy</p>
      </div>
    </div>
  </body>
</html>
